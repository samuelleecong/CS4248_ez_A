</defs>
<rect width="1040" height="670" fill="#f6f1e8" />
<rect x="0" y="0" width="1040" height="670" rx="28" fill="#fffdf8" stroke="#d8d2c8" stroke-width="2" /><rect x="0" y="0" width="1040" height="56" rx="28" fill="#d8f0df" /><text x="26" y="37" font-family="Arial Unicode MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2830">4. BiMGA (Ours)</text><rect x="26" y="84" width="988" height="66" rx="18" fill="#f0ebe1" stroke="#d8d2c8" stroke-width="1" /><text x="42" y="126" font-family="Arial Unicode MS, Arial, sans-serif" font-size="22" font-weight="400" fill="#1f2830">L = L_sup + dw·τ²·KL(...) + aw·(1/B)Σσ(m_i/τ)(||q_s-q_t||₂ + ||d_s-d_t||₂)</text><rect x="26" y="172" width="116" height="36" rx="18" fill="#d8f0df" stroke="#2e8b57" stroke-width="1" /><text x="40" y="196" font-family="Arial Unicode MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#14303a">Score KD</text><rect x="152" y="172" width="149" height="36" rx="18" fill="#d8f0df" stroke="#2e8b57" stroke-width="1" /><text x="166" y="196" font-family="Arial Unicode MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#14303a">Query Align</text><rect x="311" y="172" width="127" height="36" rx="18" fill="#d8f0df" stroke="#2e8b57" stroke-width="1" /><text x="325" y="196" font-family="Arial Unicode MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#14303a">Doc Align</text><rect x="448" y="172" width="182" height="36" rx="18" fill="#ece7de" stroke="#d8d2c8" stroke-width="1" /><text x="462" y="196" font-family="Arial Unicode MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#8c918f">Hard Negatives</text><rect x="640" y="172" width="171" height="36" rx="18" fill="#d8f0df" stroke="#2e8b57" stroke-width="1" /><text x="654" y="196" font-family="Arial Unicode MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#14303a">Margin Guided</text><rect x="26" y="228" width="335" height="220" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="1" /><rect x="383" y="228" width="256" height="220" rx="20" fill="#d8f0df" stroke="#2e8b57" stroke-width="1" /><rect x="661" y="228" width="353" height="220" rx="20" fill="#f8fafb" stroke="#d8d2c8" stroke-width="1" /><text x="44" y="254" font-family="Arial Unicode MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#5d6974">Shared base</text><text x="44" y="288" font-family="Arial Unicode MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2830">L_sup</text><text x="44" y="326" font-family="Arial Unicode MS, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2830"><tspan x="44" dy="0">One-hot supervised</tspan><tspan x="44" dy="26">retrieval loss over the</tspan><tspan x="44" dy="26">in-batch score matrix.</tspan></text><text x="401" y="254" font-family="Arial Unicode MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e8b57">Extra teacher signal</text><text x="401" y="286" font-family="Arial Unicode MS, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2830"><tspan x="401" dy="0">Aligns both query</tspan><tspan x="401" dy="26">and document</tspan><tspan x="401" dy="26">embeddings, then</tspan><tspan x="401" dy="26">weights each</tspan><tspan x="401" dy="26">sample by teacher</tspan><tspan x="401" dy="26">confidence.</tspan></text><text x="679" y="254" font-family="Arial Unicode MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#5d6974">Poster takeaway</text><text x="679" y="286" font-family="Arial Unicode MS, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2830"><tspan x="679" dy="0">Directly addresses the</tspan><tspan x="679" dy="26">symmetric retrieval gap</tspan><tspan x="679" dy="26">because both sides of the</tspan><tspan x="679" dy="26">retriever are pulled toward</tspan><tspan x="679" dy="26">teacher space.</tspan></text><line x1="367" y1="338" x2="377" y2="338" stroke="#2e8b57" stroke-width="5" marker-end="url(#arrow-bimga)" /><line x1="645" y1="338" x2="655" y2="338" stroke="#2e8b57" stroke-width="5" marker-end="url(#arrow-bimga)" /><rect x="26" y="438" width="988" height="208" rx="18" fill="#f7f3ec" stroke="#d8d2c8" stroke-width="1" /><text x="42" y="470" font-family="Arial Unicode MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e8b57">Interpretation</text><text x="42" y="502" font-family="Arial Unicode MS, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2830"><tspan x="42" dy="0">m_i = s_t(q_i,d_i⁺) - max_j≠i s_t(q_i,d_j⁻)</tspan></text>
