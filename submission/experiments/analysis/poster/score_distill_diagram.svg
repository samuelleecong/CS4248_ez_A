="#d8d2c8" stroke-width="1" /><text x="42" y="470" font-family="Arial Unicode MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#c96d1b">Interpretation</text><text x="42" y="502" font-family="Arial Unicode MS, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2830"><tspan x="42" dy="0">Best read as score-level supervision only.</tspan></text>
